[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-qr-generator"
version = "2.0.0.dev0"
description = "Cross-platform desktop Wi-Fi QR code generator."
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11",
    "PySide6>=6.8",
    "qrcode>=8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
wifi-qr = "wifi_qr.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
