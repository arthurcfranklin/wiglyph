[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wiglyph"
version = "2.0.0"
description = "A private, cross-platform desktop app for sharing Wi-Fi access with QR codes."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11",
    "PySide6>=6.8",
    "qrcode>=8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
build = [
    "pyinstaller>=6.15,<7",
]

[project.scripts]
wiglyph = "wiglyph.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
