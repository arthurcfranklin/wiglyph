name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "assets/**"
      - "packaging/launcher.py"
      - "packaging/linux/**"
      - "WiGlyph.spec"
      - "pyproject.toml"
      - ".github/workflows/build-linux.yml"

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Validate source
        run: |
          python -m compileall -q src tests packaging
          python -m pytest -q

      - name: Build application bundle
        run: |
          python -m PyInstaller --clean --noconfirm WiGlyph.spec
          test -x dist/WiGlyph/WiGlyph

      - name: Assemble AppDir
        run: |
          rm -rf build/AppDir
          mkdir -p build/AppDir/usr/bin

          cp -a dist/WiGlyph/. build/AppDir/usr/bin/
          cp packaging/linux/AppRun build/AppDir/AppRun
          cp packaging/linux/wiglyph.desktop build/AppDir/wiglyph.desktop
          cp assets/icon.png build/AppDir/wiglyph.png

          chmod +x build/AppDir/AppRun
          chmod +x build/AppDir/usr/bin/WiGlyph

      - name: Validate AppDir
        run: |
          test -x build/AppDir/AppRun
          test -x build/AppDir/usr/bin/WiGlyph
          test -f build/AppDir/wiglyph.desktop
          test -f build/AppDir/wiglyph.png

      - name: Download and verify appimagetool
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
        run: |
          curl --fail --location --retry 3 \
            --output appimagetool-x86_64.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"

          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum --check

          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool-x86_64.AppImage \
            build/AppDir \
            WiGlyph-2.0.0-linux-x86_64.AppImage

          chmod +x WiGlyph-2.0.0-linux-x86_64.AppImage

      - name: Generate SHA-256
        run: |
          sha256sum WiGlyph-2.0.0-linux-x86_64.AppImage \
            > WiGlyph-2.0.0-linux-x86_64.AppImage.sha256

          cat WiGlyph-2.0.0-linux-x86_64.AppImage.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiGlyph-2.0.0-linux-x86_64
          path: |
            WiGlyph-2.0.0-linux-x86_64.AppImage
            WiGlyph-2.0.0-linux-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 30
